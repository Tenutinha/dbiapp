<!--
  Supabase → Authentication → Emails → Templates → "Reset Password"
  Assunto (Subject): Crie sua senha da DBI
  Cole o HTML abaixo no corpo (Message body).

  Usado por "Esqueci minha senha" e "Primeiro acesso". O link aponta para o nosso site
  (/auth/confirm, type=recovery) com um token de uso único: o servidor valida, cria a sessão
  e abre a tela /entrar/nova-senha. Funciona em qualquer navegador ou aparelho.
-->
<div style="margin:0;padding:32px 16px;background:#f6f5f1;font-family:Arial,Helvetica,sans-serif;color:#1c1c1a">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e3e1da;border-radius:16px;padding:32px">
    <p style="margin:0 0 24px;font-size:18px;font-weight:bold;letter-spacing:-0.02em">DBI</p>
    <h1 style="margin:0 0 12px;font-size:24px;font-weight:normal;font-family:Georgia,serif">Crie sua senha</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#55554f">
      Clique no botão abaixo para definir a senha da sua conta. O link vale por 1 hora e só pode ser usado uma vez.
    </p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
       style="display:inline-block;background:#7c5cff;color:#ffffff;text-decoration:none;font-weight:bold;font-size:15px;padding:12px 22px;border-radius:10px">
      Criar senha
    </a>
    <p style="margin:28px 0 0;font-size:12px;line-height:1.5;color:#8a887f">
      Se você não pediu isso, pode ignorar este e-mail: sua senha atual continua valendo.
    </p>
  </div>
</div>
